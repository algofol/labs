---
- name: Wait for the Kubernetes API server
  ansible.builtin.command:
    cmd: kubectl get nodes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubernetes_api_check
  retries: 12
  delay: 5
  until: kubernetes_api_check.rc == 0
  changed_when: false

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: kubectl apply -f {{ kubernetes_cni_manifest_url }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cni_apply
  changed_when: "'created' in cni_apply.stdout or 'configured' in cni_apply.stdout"