---
- name: Upgrade all system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - containerd
      - containernetworking-plugins
      - conntrack-tools
      - iproute-tc
      - socat
    state: present

- name: Make Flannel available to the container runtime
  ansible.builtin.file:
    src: /opt/cni/bin/flannel
    dest: /usr/libexec/cni/flannel
    state: link

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts["swaptotal_mb"] | int > 0
  changed_when: true

## Kubernetes requires no swap because of false negatives and service degradation when pods use swap. This is a known issue and is documented in the Kubernetes documentation. The following task disables zram swap after reboot to ensure that Kubernetes can run without issues.
- name: Disable zram swap after reboot
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [zram0]
      zram-size = 0
  notify: Reload systemd

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay kernel module
  ansible.builtin.command: modprobe overlay
  changed_when: false

- name: Load br_netfilter kernel module
  ansible.builtin.command: modprobe br_netfilter
  changed_when: false

- name: Configure Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  notify: Reload sysctl

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate containerd configuration
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"
  notify: Restart containerd

- name: Add Kubernetes repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/rpm/repodata/repomd.xml.key"

- name: Install Kubernetes packages
  ansible.builtin.dnf:
    name:
      - kubeadm
      - kubectl
      - kubelet
    state: present

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Configure kubelet node IP
  ansible.builtin.copy:
    dest: /etc/sysconfig/kubelet
    owner: root
    group: root
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ kubernetes_node_ip }}
  notify: Restart kubelet

- name: Allow Flannel VXLAN traffic
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-port=8472/udp
  register: flannel_firewall_rule
  changed_when: "'ALREADY_ENABLED' not in flannel_firewall_rule.stdout"

- name: Reload firewall after allowing Flannel VXLAN traffic
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  when: flannel_firewall_rule.changed
  changed_when: true